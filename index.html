    <script>
      // Compatibility guard for browser extensions that patch window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Non-blocking fallback
        }

        // Suppress benign third-party browser extension injection crashes
        window.addEventListener('error', function(event) {
          if (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
            return true;
          }
        });
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
